<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --mute:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .zoom button { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 2px 8px; margin-left: 4px; }
  .live { font-size: 12px; color: var(--mute); }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #28a745; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #current { text-align: center; }
  #badge { width: 88px; height: 88px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center;
    font-size: 34px; font-weight: 700; color: #fff; background: var(--mute); }
  #title { font-weight: 600; }
  #company { color: var(--mute); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
  .chip.yes { color: #1a7f37; border-color: #1a7f37; }
  .chip.no { color: #c0392b; border-color: #c0392b; }
  #empty { color: var(--mute); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 18px 0 6px; }
  #recent { list-style: none; margin: 0; padding: 0; }
  #recent a { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; color: inherit; text-decoration: none; }
  #recent a:hover, #recent a:focus-visible { background: var(--card); outline: none; }
  .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
  .meta { min-width: 0; }
  .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { color: var(--mute); font-size: 12px; }
  details { margin-top: 16px; color: var(--mute); }
  #sent, #q { max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; padding: 10px;
    background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; }
  textarea { width: 100%; height: 100px; margin: 6px 0; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #err { color: #c0392b; margin-top: 8px; }
  footer { margin-top: 16px; font-size: 12px; }
  footer a { color: var(--accent); }
</style>
<header><h1>Jev Job Scorer</h1><span class="live" role="status">Watching this page</span>
  <span class="zoom"><button id="smaller" aria-label="Decrease font size">A−</button><button id="bigger" aria-label="Increase font size">A+</button></span></header>
<section class="card" id="current" aria-live="polite">
  <div id="empty">Open a job on LinkedIn, Indeed or Glassdoor. Scores appear here automatically.</div>
  <div id="result" hidden>
    <div id="badge"></div>
    <div id="title"></div>
    <div id="company"></div>
    <div class="chips"><span class="chip" id="tier"></span><span class="chip" id="meets"></span><span class="chip" id="lat"></span></div>
  </div>
</section>
<details id="sentBox" hidden><summary id="sentSum">What was sent to Jev</summary><pre id="sent"></pre></details>
<details id="qBox" hidden><summary>Questions asked to Jev</summary><pre id="q"></pre></details>
<div id="err" role="alert"></div>
<h2>Recent</h2>
<ul id="recent"></ul>
<details><summary>Paste a description manually</summary>
  <textarea id="text" aria-label="Job description"></textarea>
  <button id="go">Score</button>
</details>
<footer><a href="#" id="settings">Settings</a> · <a href="#" id="csv">Export CSV</a></footer>
<script src="popup.js"></script>
